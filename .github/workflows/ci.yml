name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # CI davomida haqiqiy Postgres — migratsiyalar va client tekshiriladi
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: woodflow
          POSTGRES_PASSWORD: woodflow
          POSTGRES_DB: woodflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woodflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://woodflow:woodflow@localhost:5432/woodflow?schema=public
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Migratsiyalarni qo'llash (validatsiya)
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
