# ============================================================
#  RS Development — nginx server-block (rs.elite-fitness.cloud)
#  Mavjud nginx'ga QO'SHILADI, fitnes configlariga tegmaydi.
#
#  O'rnatish (serverda):
#    cp deploy/nginx-rs.conf /etc/nginx/sites-available/rs.elite-fitness.cloud
#    ln -s /etc/nginx/sites-available/rs.elite-fitness.cloud /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#  Keyin HTTPS:
#    certbot --nginx -d rs.elite-fitness.cloud
#  (certbot faqat shu blokni tahrirlaydi — fitnes tegilmaydi)
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name rs.elite-fitness.cloud;

    # Biznes logolari / yuklamalar uchun
    client_max_body_size 20M;

    # ── API: GraphQL ──
    location /graphql {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API: yuklangan fayllar (logolar) ──
    location /uploads/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend (Next.js) ──
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
